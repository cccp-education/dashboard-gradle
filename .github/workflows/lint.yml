name: Lint

# LINT-ADOPT-13 (S-336) — this borough had NO workflow at all, so the ktlint gate
# added to `:dashboard-plugin:check` would never run (a gate that cannot run is a
# false green, the S-335 lesson). Minimal on purpose: one command, no
# `continue-on-error`, no trailing `echo` — the step's exit code IS the gate.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ktlint:
    name: Lint (ktlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: cccpeducation/cccp-ci-base@sha256:03ead3787ed8f09068cc582191e4cd8f5e48e3ce696fe53836ecd826de57ea1f

    steps:
      - uses: actions/checkout@v7
      - name: Verify Gradle wrapper version
        uses: cccp-education/conventions-gradle/.github/actions/verify-gradle-wrapper@main
        with:
          wrapper-path: dashboard-plugin/gradle/wrapper/gradle-wrapper.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # GBL-013 US-5 — the runtime image provides JDK 25; `ci/run.sh fast` is the gate.
      - name: ktlintCheck
        run: ci/run.sh fast
