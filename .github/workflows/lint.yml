name: Lint

# LINT-ADOPT-13 (S-336) — this borough had NO workflow at all, so the ktlint gate
# added to `:dashboard-plugin:check` would never run (a gate that cannot run is a
# false green, the S-335 lesson). Minimal on purpose: one command, no
# `continue-on-error`, no trailing `echo` — the step's exit code IS the gate.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ktlint:
    name: Lint (ktlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - name: Verify Gradle wrapper version
        uses: cccp-education/conventions-gradle/.github/actions/verify-gradle-wrapper@main

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ktlintCheck
        run: ./gradlew :dashboard-plugin:ktlintCheck --no-daemon --console=plain
