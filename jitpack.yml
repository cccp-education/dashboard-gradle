# CNV-17 — JitPack canal unique (N3 dashboard-plugin).
# Build from a public tag; the plugin version comes from the workspace catalog
# (`ws.versions.dashboard.plugin`, 0.0.2) and JitPack serves it at the tag.
before_install:
  - sdk install java 25-open || (sleep 10 && sdk install java 25-open)
  - sdk use java 25-open
  - java -version 2>&1 | grep -q 'version "25'
install:
  # article 0124 — `dashboard-plugin/` is a standalone build (own wrapper/settings).
  - cd dashboard-plugin && ./gradlew publishToMavenLocal -Pversion="${VERSION#v}"
env:
  CI: "true"
